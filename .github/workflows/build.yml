name: build

on:
  push:
  pull_request:
  workflow_call:

env:
  BUILD_TYPE: Release

jobs:
  build_stm32:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [ stm32f407ighx, stm32h723vgtx ]
    steps:
      - name: arm-none-eabi-gcc GNU Arm Embedded Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Install ninja
        run: sudo apt install -y ninja-build

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: './librm'
          submodules: 'recursive'

      - name: Checkout template project
        uses: actions/checkout@v4
        with:
          path: './stm32cube_template'
          repository: XDU-IRobot/stm32cube_template

      - name: Add librm to ${{ matrix.board }}
        run: |
          mv librm stm32cube_template/${{ matrix.board }}
          cd stm32cube_template/${{ matrix.board }}
          sed -i '/add_subdirectory(cmake\/stm32cubemx)/a add_subdirectory(librm)' CMakeLists.txt
          sed -i '/^    stm32cubemx$/a\    rm' CMakeLists.txt

      - name: Build ${{ matrix.board }}
        working-directory: ./stm32cube_template/${{ matrix.board }}
        run: cmake --preset ${{ env.BUILD_TYPE }} && cmake --build --preset ${{ env.BUILD_TYPE }}

  build_general_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: '.'
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libboost-all-dev libgpiod-dev pkg-config

      - name: Build
        run: cmake . -Bbuild -DCMAKE_BUILD_TYPE=$BUILD_TYPE && cmake --build build -j

