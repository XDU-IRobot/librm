name: test

on:
  push:
  pull_request:
  workflow_call:

env:
  BUILD_TYPE: Release

jobs:
  test_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libboost-all-dev libgpiod-dev libgtest-dev pkg-config

      - name: Build
        run: cmake . -Bbuild -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DLIBRM_BUILD_TESTS=ON && cmake --build build -j

      - name: Test
        run: ./build/test/librm_tests
